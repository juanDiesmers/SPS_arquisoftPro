<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">🏥</span>
      <h1>SPS</h1>
      <p>Crear Nueva Cuenta</p>
    </div>

    <form (ngSubmit)="register()" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Crea un nombre de usuario"
          class="form-control"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Correo Electronico</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="ejemplo@correo.com"
          class="form-control"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Minimo 6 caracteres"
          class="form-control"
          required
        />
      </div>

      <div class="form-group">
        <label for="cedula">Cedula / Documento</label>
        <input
          id="cedula"
          type="text"
          [(ngModel)]="cedula"
          name="cedula"
          placeholder="Numero de cedula para SaludPay"
          class="form-control"
          required
        />
      </div>

      <div *ngIf="error" class="alert alert-error">
        {{ error }}
      </div>

      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <div class="login-footer">
      <small>¿Ya tienes una cuenta? <a routerLink="/login" class="register-link">Inicia Sesion aqui</a></small>
    </div>
  </div>
</div>
