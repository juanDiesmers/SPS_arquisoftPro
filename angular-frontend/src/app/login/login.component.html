<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">🏥</span>
      <h1>SPS</h1>
      <p>Sistema de Planes de Salud</p>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Ingresa tu usuario"
          class="form-control"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Ingresa tu contraseña"
          class="form-control"
          required
        />
      </div>

      <div *ngIf="error" class="alert alert-error">
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Iniciar Sesion' }}
      </button>
    </form>

    <div class="login-footer">
      <small>¿No tienes cuenta? <a routerLink="/register" class="register-link">Registrate aqui</a></small>
      <br/>
      <small>O usa cuenta demo - Usuario: <strong>admin</strong> | Contraseña: <strong>admin123</strong></small>
    </div>
  </div>
</div>
