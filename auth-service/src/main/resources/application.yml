server:
  port: 8081
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sps_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  application:
    name: sps-auth-service
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
jwt:
  secret: ${JWT_SECRET:ChangeMe123!}
