server:
  port: 8080

spring:
  application:
    name: sps-api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**

        - id: catalog-service
          uri: http://catalog-service:8082
          predicates:
            - Path=/catalog/**

        - id: purchase-service
          uri: http://purchase-service:8083
          predicates:
            - Path=/purchase/**

        - id: saludpay
          uri: http://saludpay:8086
          predicates:
            - Path=/payments/**

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html