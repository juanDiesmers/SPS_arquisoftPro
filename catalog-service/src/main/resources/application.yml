server:
  port: 8082
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sps_catalog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings
application:
  name: sps-catalog-service
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.boot.actuate: DEBUG